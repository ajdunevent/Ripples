name: Release

# The FrogPak releaser (https://github.com/FrogPak/releaser) builds x86_64 and aarch64 Flatpak
# bundles. A push to main whose newest metainfo <release> has no tag yet creates that tag and a
# GitHub release carrying the bundles; any other push or pull request runs the checks only.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    uses: FrogPak/releaser/.github/workflows/release.yml@v1
    permissions:
      contents: write
      id-token: write
    with:
      create-tags: false
      # Ponds updated at once after a release, one owner/repository per line. Without the
      # POND_TOKEN secret they pick the release up at their next scheduled check.
      ponds: |
        ajdunevent/AJHub
    secrets:
      POND_TOKEN: ${{ secrets.POND_TOKEN }}
