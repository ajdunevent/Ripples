[package]
name = "ripples"
version = "0.1.0"
edition = "2021"
# -or-later rather than -only; MoreWaita's bundled tray icons (tray.rs) are GPL-3.0-only.
license = "GPL-3.0-or-later"

[dependencies]
# gtk4-sys 0.11.4 and libadwaita-sys 0.9.2 both require glib-sys/gio-sys 0.22.
# gtk4 0.9 / libadwaita 0.7 pulled in a second glib (0.20), which broke the
# build with "expected glib::ExitCode, found gtk4::glib::ExitCode".
gtk4 = { version = "0.11", features = ["v4_18"] }
# AdwAboutDialog's builder needs v1_5, and .build() needs gtk_v4_18.
libadwaita = { version = "0.9", features = ["v1_4", "v1_5", "gtk_v4_18"] }
# gio::File::move_future is gated behind v2_72.
gio = { version = "*", features = ["v2_72"] }
glib = "*"
# Also the cross-thread bridge to and from the tray thread.
async-channel = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
# Chunked-upload folder naming only (upload_via_chunking).
sha2 = "0.10"
# Content comparison (contents_match, webdav::hash). Several times faster than SHA-256.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# future::select, to cancel an in-flight sync_target.
futures-util = "0.3"
# Tray (tray.rs). async-io feature, not the default tokio. Runs on its own OS
# thread; ksni does not run on glib's MainContext. Cross-thread traffic goes
# through async-channel.
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
async-io = "2"
# Queries whether a StatusNotifierHost is registered (check_tray_available).
# Version and features match ksni 0.3.1 so only one zbus is built.
zbus = { version = "5", default-features = false, features = ["async-io"] }
# Decodes tray icon PNGs into ARGB32 for ksni::Icon.
image = { version = "0.25", default-features = false, features = ["png"] }
# notify_push listener. Blocking tungstenite on a dedicated OS thread.
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# All WebDAV and push HTTP calls, via reqwest's blocking client on dedicated
# threads. ureq-proto 0.6.0 rejects PROPFIND, MKCOL and MOVE. The form feature
# is for the Login Flow v2 poll in nextcloud_login.rs.
reqwest = { version = "0.13", features = ["blocking", "form"] }
# Clears credentials from memory after use (notify_push pre_auth, WebDAV
# Authorization headers).
zeroize = "1"
# App password storage for direct (non-GOA) accounts, in nextcloud_login.rs.
# Selects the Secret Service backend on a normal session and a file backend
# under Flatpak. async-std rather than the default tokio, to avoid a second runtime.
oo7 = { version = "0.6", default-features = false, features = ["native_crypto", "async-std"] }
# PROPFIND multistatus parsing in webdav.rs. Matched on local_name() so any
# namespace prefix works.
quick-xml = "0.36"
# Instant on Linux uses CLOCK_MONOTONIC, which does not advance during suspend,
# so periodic-poll gates (last_full_check, round_finished) undercounted elapsed
# time on a phone. boot_time uses CLOCK_BOOTTIME. Adds no wakeups.
boot-time = "0.1"

# Icon and desktop-file install paths only. Not a complete cargo-deb config.
[package.metadata.deb]
assets = [
    ["assets/icons/app/net.dunevent.Ripples.svg", "usr/share/icons/hicolor/scalable/apps/net.dunevent.Ripples.svg", "644"],
    ["assets/icons/app/net.dunevent.Ripples-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/net.dunevent.Ripples-symbolic.svg", "644"],
    ["assets/net.dunevent.Ripples.desktop", "usr/share/applications/net.dunevent.Ripples.desktop", "644"],
]
